name: GitHub Stats Update
on:
  schedule:
    - cron: '0 3 * * *'  # Complete branch-history crawl once daily
  workflow_dispatch:      # Allows manual trigger

concurrency:
  group: github-stats-update
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_COMMIT_TOKEN || github.token }}

      - name: Generate Stats
        uses: VatsalSy/commits-readme-stats@c99b9539ba435cd29c66f7084264bc9c47e7af84
        with:
          GH_COMMIT_TOKEN: ${{ secrets.GH_COMMIT_TOKEN || github.token }}
          SHOW_COMMIT: true
          SHOW_DAYS_OF_WEEK: true
          # WakaTime integration
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_WAKATIME: true
          SHOW_LANGUAGE: true
          SHOW_EDITORS: true
          SHOW_PROJECTS: true
          SHOW_OS: true
          # Commit settings
          COMMIT_MESSAGE: 'docs(stats): update github stats'
          COMMIT_BY_ME: false
          COMMIT_USERNAME: 'github-actions[bot]'
          COMMIT_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
