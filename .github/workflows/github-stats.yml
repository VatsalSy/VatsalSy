name: GitHub Stats Update
on:
  schedule:
    - cron: '41 3 1,15 * *'  # Complete default-branch crawl on the 1st and 15th at 03:41 UTC
  workflow_dispatch:      # Allows manual trigger

concurrency:
  group: github-stats-update
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_COMMIT_TOKEN || github.token }}

      - name: Generate Stats
        uses: VatsalSy/commits-readme-stats@46fcfb462c8bb0615685721fd395656e1b4928b9
        with:
          GH_COMMIT_TOKEN: ${{ secrets.GH_COMMIT_TOKEN || github.token }}
          # Keep time-of-day ASCII here; the OSS Insight timing widget was removed
          # from README as redundant. Do not set both SHOW_* flags false — that
          # skips the crawl and drops the unique-commit line.
          SHOW_COMMIT: true
          SHOW_DAYS_OF_WEEK: false
          # Commit settings
          COMMIT_MESSAGE: 'docs(stats): update github stats'
          COMMIT_BY_ME: false
          COMMIT_USERNAME: 'github-actions[bot]'
          COMMIT_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
